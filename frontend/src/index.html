<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synced Media Player</title>
  
  <!-- Typography: Fraunces (characterful soft serif) & Nunito (clean readable sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Atmospheric floating embers & subtle upward sparkles -->
  <div class="cozy-embers" aria-hidden="true">
    <span class="ember e1"></span>
    <span class="ember e2"></span>
    <span class="ember e3"></span>
    <span class="ember e4"></span>
    <span class="ember e5"></span>
    <span class="ember e6"></span>
    <span class="ember e7"></span>
    <span class="ember e8"></span>
    <span class="ember-sparkle s1">✦</span>
    <span class="ember-sparkle s2">✧</span>
    <span class="ember-sparkle s3">✦</span>
  </div>

  <!-- Delicate scalloped string lights banner -->
  <div class="string-lights-banner" aria-hidden="true">
    <svg class="string-lights-svg" viewBox="0 0 1200 36" preserveAspectRatio="none">
      <path d="M0,6 Q75,22 150,6 Q225,22 300,6 Q375,22 450,6 Q525,22 600,6 Q675,22 750,6 Q825,22 900,6 Q975,22 1050,6 Q1125,22 1200,6" fill="none" stroke="#DCCEC3" stroke-width="1.5" stroke-dasharray="3 2" />
      
      <!-- Pastel glowing bulbs -->
      <circle cx="75" cy="22" r="5" fill="#F7CCD3" class="light-bulb bulb-blush" />
      <rect x="73.5" y="17" width="3" height="3" rx="1" fill="#A89284" />
      <circle cx="225" cy="22" r="5" fill="#FDE8AF" class="light-bulb bulb-yellow" />
      <rect x="223.5" y="17" width="3" height="3" rx="1" fill="#A89284" />
      <circle cx="375" cy="22" r="5" fill="#FBD8C0" class="light-bulb bulb-peach" />
      <rect x="373.5" y="17" width="3" height="3" rx="1" fill="#A89284" />
      <circle cx="525" cy="22" r="5" fill="#CFDEC8" class="light-bulb bulb-sage" />
      <rect x="523.5" y="17" width="3" height="3" rx="1" fill="#A89284" />
      <circle cx="675" cy="22" r="5" fill="#DDD4F0" class="light-bulb bulb-lavender" />
      <rect x="673.5" y="17" width="3" height="3" rx="1" fill="#A89284" />
      <circle cx="825" cy="22" r="5" fill="#FDE8AF" class="light-bulb bulb-yellow" />
      <rect x="823.5" y="17" width="3" height="3" rx="1" fill="#A89284" />
      <circle cx="975" cy="22" r="5" fill="#F7CCD3" class="light-bulb bulb-blush" />
      <rect x="973.5" y="17" width="3" height="3" rx="1" fill="#A89284" />
      <circle cx="1125" cy="22" r="5" fill="#FBD8C0" class="light-bulb bulb-peach" />
      <rect x="1123.5" y="17" width="3" height="3" rx="1" fill="#A89284" />
    </svg>
  </div>

  <div class="app-layout">
    
    <!-- Header: Room badge -->
    <header class="hearth-header">
      <h1 class="room-heading">
        <span class="room-indicator-dot" aria-hidden="true"></span>
        <span id="roomNameDisplay">Room</span>
      </h1>
    </header>

    <!-- Main Content Grid -->
    <main class="app-container">
      
      <!-- Video Section (Left Column) -->
      <section class="video-container">
        
        <!-- Video Hearth Frame with subtle pulsing firelight glow -->
        <div class="video-hearth-frame">
          <video id="videoPlayer" controls width="640">
            <source id="videoSource" src="" type="video/mp4">
          </video>

          <div id="youtubeContainer" style="display: none; width: 100%; height: 450px;">
            <div id="youtubePlayer"></div>
          </div>
        </div>

        <!-- Autoplay policy unmute banner -->
        <div id="unmuteBanner" class="unmute-banner">
          <svg class="banner-svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
          <div class="banner-text">
            Sound is muted by browser policy. <strong>Click anywhere to unmute</strong>.
          </div>
        </div>

        <!-- Media status & error messages -->
        <div id="mediaStatus" class="media-status"></div>

        <!-- Currently playing media indicator -->
        <div id="currentMediaInfo" class="current-media-info" style="display: none;">
          <svg class="media-info-svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="4"></rect>
            <path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"></path>
          </svg>
          <div class="current-media-details">
            <span class="current-media-label">Playing:</span>
            <a id="currentMediaLink" href="#" target="_blank" rel="noopener noreferrer"></a>
          </div>
        </div>

        <!-- Controls Deck -->
        <div class="hearth-controls-card">
          <!-- Server selection row -->
          <div class="controls-container">
            <div class="select-wrapper">
              <select id="videoList" aria-label="Select server video">
                <option value="">Select server video...</option>
              </select>
            </div>

            <button class="ready" id="readyButton">Ready</button>
          </div>

          <!-- URL stream loader row with integrated prefix icon -->
          <div class="url-input-container">
            <div class="input-wrapper">
              <span class="input-prefix-icon" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
              </span>
              <input type="text" id="urlInput" placeholder="Paste YouTube link, Dropbox, or MP4 URL..." aria-label="Video link or URL">
            </div>
            <button id="loadUrlButton" class="ready load-btn">Load URL</button>
          </div>
        </div>

      </section>

      <!-- Messages Section (Right Column) -->
      <section class="chat-container">
        <div class="chat-header">
          <svg class="chat-header-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <h2 class="chat-header-title">Messages</h2>
        </div>

        <div class="chat-messages">
          <div class="chat-empty-state">
            <svg class="empty-state-svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            <p>No messages yet.</p>
          </div>
        </div>
      </section>

    </main>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js" defer></script>
  <script src="listener.js" defer></script>
</body>
</html>
