<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synced Media Lounge</title>
  
  <!-- Typography: Bricolage Grotesque (Bold, Punchy Display) & Outfit (Comforting, Clear Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-layout">
    
    <!-- Header: Room Title (Clickable link back to join page) -->
    <header class="theater-header">
      <h1 class="room-heading">
        <a href="/" class="room-nav-link" title="Return to room selection" aria-label="Return to room selection">
          <span class="room-indicator-dot" aria-hidden="true"></span>
          <span id="roomNameDisplay">Room</span>
        </a>
      </h1>
    </header>

    <!-- Main Content Grid -->
    <main class="app-container">
      
      <!-- Video Section (Left Column) -->
      <section class="video-container">
        
        <!-- Cinema Projection Stage -->
        <div class="video-hearth-frame">
          <video id="videoPlayer" controls width="640">
            <source id="videoSource" src="" type="video/mp4">
          </video>

          <div id="youtubeContainer" style="display: none; width: 100%; height: 450px;">
            <div id="youtubePlayer"></div>
          </div>
        </div>

        <!-- Autoplay policy unmute advisory banner -->
        <div id="unmuteBanner" class="unmute-banner">
          <svg class="banner-svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
          <div class="banner-text">
            Sound is muted by browser autoplay policy. <strong>Click anywhere to unmute</strong>.
          </div>
        </div>

        <!-- Media status & error messages -->
        <div id="mediaStatus" class="media-status"></div>

        <!-- Currently playing media indicator -->
        <div id="currentMediaInfo" class="current-media-info" style="display: none;">
          <div class="current-media-details">
            <span class="current-media-label">Now Playing:</span>
            <a id="currentMediaLink" href="#" target="_blank" rel="noopener noreferrer"></a>
          </div>
        </div>

        <!-- Tactile Hi-Fi Controls Deck -->
        <div class="hearth-controls-card">
          <!-- Server video selector row (only active in /server room) -->
          <div class="controls-container" id="serverControlsRow" style="display: none;">
            <div class="select-wrapper">
              <select id="videoList" aria-label="Select server video">
                <option value="">Select server video...</option>
              </select>
            </div>
          </div>

          <!-- URL stream loader deck -->
          <div class="url-input-container">
            <div class="input-wrapper">
              <span class="input-prefix-icon" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
              </span>
              <input type="text" id="urlInput" placeholder="Paste YouTube link, Dropbox, or MP4 URL..." aria-label="Video link or URL">
            </div>
            <button id="loadUrlButton" class="ready load-btn">Load URL</button>
            <button class="ready" id="readyButton">Ready</button>
          </div>
        </div>

      </section>

      <!-- Lounge Messages Section (Right Column) -->
      <section class="chat-container">
        <div class="chat-header">
          <div class="chat-header-info">
            <svg class="chat-header-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <h2 class="chat-header-title">Lounge Messages</h2>
          </div>
          <button type="button" id="changeNameBtn" class="chat-name-pill" title="Click to change your nickname">
            <span class="user-pill-dot" aria-hidden="true"></span>
            <span id="currentUserNameDisplay">Set Name</span>
          </button>
        </div>

        <div class="chat-messages">
          <div class="chat-empty-state">
            <svg class="empty-state-svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            <p>The lounge is quiet. Send a note to the couch to start the conversation.</p>
          </div>
        </div>

        <!-- Chat input bar -->
        <form id="chatForm" class="chat-input-deck" autocomplete="off">
          <input 
            type="text" 
            id="chatInput" 
            placeholder="Message the room..." 
            maxlength="500" 
            aria-label="Chat message"
          >
          <button type="submit" id="chatSendBtn" class="chat-send-btn" aria-label="Send message">
            <span>Send</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>

        <!-- Nickname prompt overlay -->
        <div id="nicknameModal" class="nickname-modal-backdrop" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="nicknamePromptTitle">
          <div class="nickname-modal-card">
            <h3 id="nicknamePromptTitle" class="nickname-modal-title">What's your name?</h3>
            <p class="nickname-modal-desc">Enter a nickname so friends in the lounge know who is messaging.</p>
            <form id="nicknameForm" class="nickname-modal-form" autocomplete="off">
              <input 
                type="text" 
                id="nicknameInput" 
                placeholder="Your name or nickname..." 
                maxlength="30" 
                required 
                aria-label="Your nickname"
              >
              <div class="nickname-modal-actions">
                <button type="button" id="cancelNicknameBtn" class="ready" style="display: none;">Cancel</button>
                <button type="submit" id="saveNicknameBtn" class="ready load-btn">Join Chat</button>
              </div>
            </form>
          </div>
        </div>
      </section>

    </main>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js" defer></script>
  <script src="listener.js" defer></script>
</body>
</html>
