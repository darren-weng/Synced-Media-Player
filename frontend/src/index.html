<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synced Media Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <div class="video-container">
      <video id="videoPlayer" controls width="640">
        <source id="videoSource" src="" type="video/mp4">
      </video>

      <div id="youtubeContainer" style="display: none; width: 100%; height: 450px;">
        <div id="youtubePlayer"></div>
      </div>

      <div id="unmuteBanner" class="unmute-banner">
        🔊 Video is playing muted due to browser autoplay policy. <strong>Click anywhere to unmute</strong>.
      </div>

      <div id="mediaStatus" class="media-status"></div>

      <div class="controls-container">
        <select id="videoList">
          <option value="">Select server video...</option>
        </select>

        <button class="ready" id="readyButton">Ready</button>
      </div>

      <div class="url-input-container">
        <input type="text" id="urlInput" placeholder="Paste YouTube link, Dropbox, or MP4 URL...">
        <button id="loadUrlButton" class="ready">Load URL</button>
      </div>

      <div id="currentMediaInfo" class="current-media-info" style="display: none;">
        <strong>Current:</strong> <a id="currentMediaLink" href="#" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </div>

    <div class="chat-container">
      <div class="chat-header">Messages</div>
      <div class="chat-messages">
      </div>
    </div>

  </div>

</body>
<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="script.js" defer></script>
<script src="listener.js" defer></script>
</html>
